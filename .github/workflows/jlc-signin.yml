name: JLC Auto Sign

on:
  schedule:
    # 避开整点拥堵，每日两次执行（北京时间 08:23 主签到 + 16:23 兜底补签）
    - cron: '23 0 * * *'
    - cron: '23 8 * * *'

  workflow_dispatch:
    inputs:
      notify_always:
        description: '即使今日已签到也推送 Bark 状态通知'
        required: false
        default: false
        type: boolean

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Unit Tests
      run: |
        python -m unittest -v test_main.py

    - name: Run Sign Script
      env:
        TOKEN_LIST: ${{ secrets.TOKEN_LIST }}
        SEND_KEY_LIST: ${{ secrets.SEND_KEY_LIST }}
        NOTIFY_ALWAYS: ${{ inputs.notify_always || 'false' }}
      run: |
        python main.py
